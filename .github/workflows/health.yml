name: Santé de la démo

# Chaque matin : /api/health de la démo (route publique, exemptée de la porte), puis le règlement par pg_cron : dernier run réussi de
# wm-settle il y a 60 s au plus, aucune enchère échue en souffrance (M3-21, P13).
# Effet voulu : la requête garde le projet Supabase Free éveillé (C25).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEMO_URL: https://wmr-ivm.vercel.app
    steps:
      - shell: bash
        run: |
          curl -fsS --max-time 30 "$DEMO_URL/api/health" > health.json
          jq -e '.settle_lag_s != null and .settle_lag_s <= 60 and .overdue_s == null' health.json
      - if: failure()
        shell: bash # -eo pipefail : un `gh issue list` en échec fait échouer l'étape au lieu de créer un doublon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Santé de la démo en échec'
          body="\`GET $DEMO_URL/api/health\` a échoué ou le règlement est en retard : $RUN_URL"
          if [[ -s health.json ]]; then body+=$'\n\n```json\n'"$(cat health.json)"$'\n```'; fi
          n="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [[ -n "$n" ]]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
