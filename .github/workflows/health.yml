name: Santé de la démo

# Chaque matin : /api/health de la démo (route publique, exemptée de la porte).
# Effet voulu : la requête garde le projet Supabase Free éveillé (C25).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEMO_URL: https://wmr-ivm.vercel.app
    steps:
      - run: curl -fsS --max-time 30 "$DEMO_URL/api/health"
      - if: failure()
        shell: bash # -eo pipefail : un `gh issue list` en échec fait échouer l'étape au lieu de créer un doublon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Santé de la démo en échec'
          body="\`GET $DEMO_URL/api/health\` a échoué : $RUN_URL"
          n="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [[ -n "$n" ]]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
