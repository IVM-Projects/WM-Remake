name: CI

# Branches de travail : CI par leur PR (ou à la demande), pas à chaque push, sinon chaque commit tourne deux fois.
on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # C31 : budget Actions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run coverage:recap

  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # C31 : budget Actions
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Archives du banc : la SHA-256 de get-tools.sh reste le contrôle, le cache évite seulement le téléchargement.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/postgrest
            .cache/gotrue
            .cache/mailpit
          key: bench-tools-${{ hashFiles('scripts/get-tools.sh') }}
      - run: bash scripts/get-tools.sh
      - run: npm run test:db
      - run: npm run build:test
      - run: npm run test:contract
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Échec de n'importe quelle étape : rapport, traces et captures Playwright, journaux Next/GoTrue/PostgREST/Mailpit du banc.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-failure
          path: |
            playwright-report/
            test-results/
            .cache/logs/
          include-hidden-files: true
          retention-days: 7
