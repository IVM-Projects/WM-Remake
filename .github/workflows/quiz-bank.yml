name: Banques de quiz

# Banques de quiz des batailles (M5a-7) : OmniRoute 3.8.51 en mode self-hosted, un seul fournisseur `openai` vers Mistral,
# lancé par scripts/quiz/omniroute.sh. Job `probe` : la clé Mistral liste les modèles en direct, puis complète un jeton à
# travers OmniRoute ; elle doit rendre 200 avant toute génération (M5a-3). Job `smoke` (push, sans secret) : toute la chaîne à
# travers OmniRoute contre le faux serveur, puis l'arrêt quota. Job `generate` (à la demande et chaque nuit, sur develop) : les banques.
# Dépôt public : aucun énoncé, aucune option, aucune clé dans un journal ni un artefact ; une clé n'est posée que dans l'env:
# de l'étape qui la lit, jamais dans celui du workflow ou d'un job. Planifié chaque nuit depuis le premier run réussi (run 41036739472).
on:
  push:
    paths:
      - 'scripts/quiz/**'
      - '.github/workflows/quiz-bank.yml'
  workflow_dispatch:
    inputs:
      max:
        description: 'Cartes au plus (vide : vars.QUIZ_MAX, sinon 250 ; plafond 1 500)'
        type: string
        default: ''
      dry_run:
        description: 'Ni quiz_store ni quiz_fail ; sans --input, la file est lue par wm.quiz_next, dont la remise en file est la seule écriture (C12)'
        type: boolean
        default: false
  schedule:
    - cron: '37 3 * * *'

defaults:
  run:
    shell: bash # -eo pipefail

permissions:
  contents: read

env:
  OMNIROUTE_IMAGE: ghcr.io/diegosouzapw/omniroute:3.8.51@sha256:8bd462c9f60d8eda79329cfbb6ea7ea723505fe7721beb944f3d43835409e218
  SUPABASE_URL: https://iggurckxmoagsajzrnwd.supabase.co
  QUIZ_MODEL: ${{ vars.QUIZ_MODEL || 'ministral-14b-latest' }} # l'offre de la clé n'a pas de quota pour small et medium (run 40423917678)

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Secret
        id: secrets
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [[ -z $MISTRAL_API_KEY ]]; then
            echo "::notice::Sonde sautée : secret MISTRAL_API_KEY absent (D:1116)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.secrets.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Verdict sur la clé, sans OmniRoute : le code HTTP et les ids des modèles, rien d'autre. Un 401 ou 403 n'est pas
      # relancé par --retry ; un échec réseau donne 000 et passe par ::error::.
      - name: Modèles de Mistral (appel direct)
        if: steps.secrets.outputs.run == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          out="$RUNNER_TEMP/models.json"
          rm -f "$out"
          code=$(curl -sS --max-time 30 --retry 1 --retry-delay 30 -o "$out" -w '%{http_code}' -H "Authorization: Bearer $MISTRAL_API_KEY" https://api.mistral.ai/v1/models || true)
          echo "GET /v1/models : $code"
          if [[ $code != 200 ]]; then
            hint=''
            case $code in 401 | 403) hint=" : recrée la clé avec l'accès API (console.mistral.ai)" ;; esac
            echo "::error::GET https://api.mistral.ai/v1/models : HTTP $code$hint"
            exit 1
          fi
          ids=$(jq -er '.data[].id' "$out" 2> /dev/null) || { echo "::error::GET https://api.mistral.ai/v1/models : HTTP 200, réponse illisible"; exit 1; }
          echo "$ids"

      - name: OmniRoute
        if: steps.secrets.outputs.run == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: PROVIDER_KEY="$MISTRAL_API_KEY" scripts/quiz/omniroute.sh https://api.mistral.ai/v1

      # La garde : étape à part, sans secret ; OMNIROUTE_KEY n'existe qu'après l'étape qui l'écrit dans $GITHUB_ENV (sinon
      # 401 « Invalid API key »). Sans Content-Type, OmniRoute rend 415. --retry relance une fois un 408, 429 ou 5xx passager.
      - name: Complétion d'un jeton à travers OmniRoute
        if: steps.secrets.outputs.run == 'true'
        run: |
          out="$RUNNER_TEMP/completion.json"
          rm -f "$out"
          code=$(curl -sS --retry 1 --retry-delay 30 --max-time 60 -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' -H "Authorization: Bearer $OMNIROUTE_KEY" --data-binary '{"messages":[{"role":"user","content":"Réponds ok."}],"max_tokens":1}' http://127.0.0.1:20128/v1/chat/completions || true)
          if [[ $code != 200 ]]; then
            # .error.message seul, jamais le corps entier. upstream_details n'existe que sur une erreur recopiée de l'amont
            # (buildErrorBody d'OmniRoute) ; son absence ne prouve pas qu'OmniRoute l'a produite.
            msg=$(jq -er '(.error.message // "sans message" | tostring | gsub("[\r\n]+"; " ")) + (if .upstream_details then " [source : amont]" else " [source : ?]" end)' "$out" 2> /dev/null) || msg='aucune réponse lisible'
            echo "::error::POST /v1/chat/completions à travers OmniRoute : HTTP $code, $msg"
            exit 1
          fi
          model=$(jq -er '.model' "$out" 2> /dev/null) || { echo "::error::POST /v1/chat/completions à travers OmniRoute : HTTP 200, réponse illisible"; exit 1; }
          echo "POST /v1/chat/completions : $code, modèle $model"

      # Diagnostic après un échec seulement (il ne consomme rien avant la garde) : complétion d'un jeton en direct, modèle
      # par modèle, pour choisir le repli de QUIZ_MODEL. Une ligne par modèle : id, code HTTP et message d'erreur de Mistral
      # (`detail` sur un 401) ; ni corps, ni en-tête, ni texte généré. Jamais bloquant.
      - name: Complétion directe par modèle (diagnostic)
        if: failure() && steps.secrets.outputs.run == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          out="$RUNNER_TEMP/direct.json"
          models=$(printf '%s\n' "$QUIZ_MODEL" mistral-small-latest mistral-small-2603 ministral-8b-latest ministral-14b-latest mistral-medium-latest codestral-2508 | awk '!seen[$0]++')
          for model in $models; do
            rm -f "$out"
            body=$(jq -cn --arg m "$model" '{model: $m, messages: [{role: "user", content: "Réponds ok."}], max_tokens: 1}')
            code=$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' -H "Authorization: Bearer $MISTRAL_API_KEY" --data-binary "$body" https://api.mistral.ai/v1/chat/completions || true)
            msg=$(jq -r '.message // .error.message // .detail // "" | tostring | gsub("[\r\n]+"; " ")' "$out" 2> /dev/null || true)
            echo "$model $code $msg"
            sleep 2
          done

  # La chaîne entière à travers OmniRoute (détournement self-hosted, corps de la requête et de la réponse), contre le faux
  # serveur : aucun secret. OMNIROUTE_KEY n'existe qu'après l'étape de omniroute.sh, d'où generate.ts dans les suivantes.
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Sans --retry-connrefused, curl ne relance pas un refus de connexion, et le serveur n'écoute pas encore.
      - name: Faux serveur, puis OmniRoute devant lui
        run: |
          node scripts/quiz/fake-upstream.ts --port 18090 &
          echo "FAKE_PID=$!" >> "$GITHUB_ENV"
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:18090/v1/models > /dev/null
          PROVIDER_KEY=fake scripts/quiz/omniroute.sh http://127.0.0.1:18090/v1

      # Les lignes de generate.ts ne portent que des comptes, des card_id et le model ; le résumé est la dernière.
      - name: Génération à travers OmniRoute (faux serveur)
        run: |
          out="$RUNNER_TEMP/smoke.jsonl"
          node scripts/quiz/generate.ts --base-url http://127.0.0.1:20128/v1 --input scripts/quiz/fixtures/cards.json --text summary --max 5 --min-gap-s 0 --dry-run | tee "$out"
          tail -n 1 "$out" | jq -e '.summary.cards == 5 and .summary.stored == 5'

      # Le chemin quota à travers OmniRoute (C12) : 429 de l'amont, arrêt du run, sortie 0 ; le ::warning:: est sur stderr.
      - name: Arrêt quota à travers OmniRoute (faux serveur en rate_limit)
        run: |
          out="$RUNNER_TEMP/quota.jsonl"
          kill "$FAKE_PID"
          # Sinon l'attente ci-dessous pourrait encore joindre l'ancien serveur, en mode ok, sur le même port.
          for _ in {1..50}; do kill -0 "$FAKE_PID" 2> /dev/null || break; sleep 0.1; done
          node scripts/quiz/fake-upstream.ts --port 18090 --mode rate_limit &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:18090/v1/models > /dev/null
          node scripts/quiz/generate.ts --base-url http://127.0.0.1:20128/v1 --input scripts/quiz/fixtures/cards.json --text summary --max 5 --min-gap-s 0 --dry-run | tee "$out"
          tail -n 1 "$out" | jq -e '.summary.stopped == "quota"'

  # Génération à la demande, sur develop seulement, après une sonde verte. npm ci passe avant le conteneur : une fois celui-ci
  # lancé, docker inspect livre son environnement (la clé Mistral) à toute étape suivante, scripts d'installation compris.
  generate:
    if: github.event_name != 'push' && github.ref == 'refs/heads/develop'
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: quiz-bank-generate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Secrets
        id: secrets
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [[ -z $MISTRAL_API_KEY ]]; then
            echo "::notice::Sonde sautée : secret MISTRAL_API_KEY absent (D:1116)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [[ -z $SUPABASE_SECRET_KEY ]]; then
            echo "::error::Secret SUPABASE_SECRET_KEY absent (Settings → Secrets and variables → Actions)"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: OmniRoute
        if: steps.secrets.outputs.run == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: PROVIDER_KEY="$MISTRAL_API_KEY" scripts/quiz/omniroute.sh https://api.mistral.ai/v1

      # MAX en bash, pas par une expression || : une entrée '0' est passée telle quelle à --max.
      - name: Génération des banques à travers OmniRoute
        if: steps.secrets.outputs.run == 'true'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_INPUT: ${{ inputs.max }}
          QUIZ_MAX: ${{ vars.QUIZ_MAX }}
        run: |
          MAX="${MAX_INPUT:-${QUIZ_MAX:-250}}"
          node scripts/quiz/generate.ts --base-url http://127.0.0.1:20128/v1 --max "$MAX" --deadline-min 50 --min-gap-s "${{ vars.QUIZ_MIN_GAP_S || 30 }}" --text extracts ${{ inputs.dry_run && '--dry-run' || '' }}
